# CI
name: "CodeQL Code Scanning"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ master ]
    paths:
      - 'launcher/**'
      - 'libraries/**'
      - 'tests/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - 'vcpkg.json'
      - '.github/codeql/**'
      - '.github/workflows/codeql.yml'
      - '.github/actions/setup-dependencies/**'
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions: { }

jobs:
  CodeQL:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: "true"
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          config-file: ./.github/codeql/codeql-config.yml
          queries: security-and-quality
          languages: cpp, java

      - name: Setup dependencies
        uses: $/.github/actions/setup-dependencies
        with:
          build-type: Debug
          qt-version: 6.9.3

      - name: Configure and Build
        run: |
          cmake --preset linux -DLauncher_USE_PCH=OFF
          cmake --build --preset linux --config Debug

      - name: Run tests
        run: |
          ctest --preset linux --build-config Debug --extra-verbose --output-on-failure

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
