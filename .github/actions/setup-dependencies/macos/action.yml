name: Setup macOS dependencies

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug

runs:
  using: composite

  steps:
    - name: Install dependencies
      shell: bash
      run: |
        brew update
        brew install ninja extra-cmake-modules temurin@17 mono

    - name: Set JAVA_HOME
      shell: bash
      # value comes from java_home, not user input
      run: | # zizmor: ignore[github-env]
        echo "JAVA_HOME=$(/usr/libexec/java_home -v 17)" >> "$GITHUB_ENV"

    - name: Setup vcpkg cache
      if: ${{ inputs.build-type == 'Debug' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/vcpkg/archives
        key: ${{ runner.os }}-vcpkg-${{ inputs.build-type }}
        restore-keys: ${{ runner.os }}-vcpkg-

    - name: Setup vcpkg environment
      shell: bash
      # value comes from the runner image, not user input
      run: | # zizmor: ignore[github-env]
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
