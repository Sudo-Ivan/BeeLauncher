name: Setup Windows Dependencies
description: Install and setup dependencies for building Bee Launcher

inputs:
  build-type:
    description: Type for the build
    required: true
    default: Debug
  msystem:
    description: MSYS2 subsystem to use
    required: false
  vcvars-arch:
    description: Visual Studio architecture to use
    required: true
    default: amd64

runs:
  using: composite

  steps:
    # NOTE: Installed on MinGW as well for SignTool
    - name: Enter VS Developer shell
      if: ${{ runner.os == 'Windows' }}
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
      with:
        arch: ${{ inputs.vcvars-arch }}

    - name: Setup Java (MSVC)
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
      with:
        # NOTE(@getchoo): We should probably stay on Zulu.
        # Temurin doesn't have Java 17 builds for WoA
        distribution: zulu
        java-version: 17

    - name: Setup vcpkg cache (MSVC)
      if: ${{ inputs.msystem == '' && inputs.build-type == 'Debug' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~\AppData\Local\vcpkg\archives
        key: ${{ runner.os }}-vcpkg-${{ inputs.build-type }}
        restore-keys: ${{ runner.os }}-vcpkg-

    - name: Setup vcpkg environment (MSVC)
      if: ${{ inputs.msystem == '' }}
      shell: bash
      # value comes from the runner image, not user input
      run: | # zizmor: ignore[github-env]
        echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

    - name: Setup MSYS2 (MinGW)
      if: ${{ inputs.msystem != '' }}
      uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2
      with:
        msystem: ${{ inputs.msystem }}
        update: true
        install: >-
          git
        pacboy: >-
          toolchain:p
          ccache:p
          cmake:p
          extra-cmake-modules:p
          ninja:p
          qt6-base:p
          qt6-svg:p
          qt6-imageformats:p
          qt6-networkauth:p
          cmark:p
          qrencode:p
          tomlplusplus:p
          libarchive:p

    - name: List pacman packages (MinGW)
      if: ${{ inputs.msystem != '' }}
      shell: msys2 {0}
      run: |
        pacman -Qe

    - name: Retrieve ccache cache (MinGW)
      if: ${{ inputs.msystem != '' && inputs.build-type == 'Debug' }}
      uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
      with:
        path: '${{ github.workspace }}\.ccache'
        key: ${{ runner.os }}-mingw-w64-ccache-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-mingw-w64-ccache

    - name: Setup ccache (MinGW)
      if: ${{ inputs.msystem != '' && inputs.build-type == 'Debug' }}
      shell: msys2 {0}
      run: |
        ccache --set-config=cache_dir='${{ github.workspace }}\.ccache'
        ccache --set-config=max_size='500M'
        ccache --set-config=compression=true
        ccache -p  # Show config
