name: Package for macOS
description: Create a macOS package for Bee Launcher

inputs:
  version:
    description: Launcher version
    required: true
  build-type:
    description: Type for the build
    required: true
    default: Debug
  artifact-name:
    description: Name of the uploaded artifact
    required: true
    default: macOS
  apple-codesign-cert:
    description: Certificate for signing macOS builds
    required: false
  apple-codesign-password:
    description: Password for signing macOS builds
    required: false
  apple-codesign-id:
    description: Certificate ID for signing macOS builds
    required: false
  apple-notarize-apple-id:
    description: Apple ID used for notarizing macOS builds
    required: false
  apple-notarize-team-id:
    description: Team ID used for notarizing macOS builds
    required: false
  apple-notarize-password:
    description: Password used for notarizing macOS builds
    required: false
  sparkle-ed25519-key:
    description: Private key for signing Sparkle updates
    required: false

runs:
  using: composite

  steps:
    - name: Fetch codesign certificate
      shell: bash
      env:
        APPLE_CODESIGN_CERT: ${{ inputs.apple-codesign-cert }}
        APPLE_CODESIGN_ID: ${{ inputs.apple-codesign-id }}
        APPLE_CODESIGN_PASSWORD: ${{ inputs.apple-codesign-password }}
      run: |
        echo "$APPLE_CODESIGN_CERT" | base64 --decode > codesign.p12
        if [ -n "$APPLE_CODESIGN_ID" ]; then
          security create-keychain -p "$APPLE_CODESIGN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$APPLE_CODESIGN_PASSWORD" build.keychain
          security import codesign.p12 -k build.keychain -P "$APPLE_CODESIGN_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$APPLE_CODESIGN_PASSWORD" build.keychain
        else
          echo ":warning: Using ad-hoc code signing for macOS, as certificate was not present." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Package
      shell: bash
      env:
        BUILD_DIR: build
        BUILD_TYPE: ${{ inputs.build-type }}
        INSTALL_DIR: install
        APPLE_CODESIGN_ID_INPUT: ${{ inputs.apple-codesign-id }}
      run: |
        cmake --install "$BUILD_DIR" --config "$BUILD_TYPE"

        cd "$INSTALL_DIR"
        chmod +x "BeeLauncher.app/Contents/MacOS/beelauncher"

        if [ -n "$APPLE_CODESIGN_ID_INPUT" ]; then
          APPLE_CODESIGN_ID="$APPLE_CODESIGN_ID_INPUT"
          ENTITLEMENTS_FILE='../program_info/App.entitlements'
        else
          APPLE_CODESIGN_ID='-'
          ENTITLEMENTS_FILE='../program_info/AdhocSignedApp.entitlements'
        fi

        sudo codesign --sign "$APPLE_CODESIGN_ID" --deep --force --entitlements "$ENTITLEMENTS_FILE" --options runtime "BeeLauncher.app/Contents/MacOS/beelauncher"
        mv "BeeLauncher.app" "Bee Launcher.app"

    - name: Notarize
      shell: bash
      env:
        INSTALL_DIR: install
        APPLE_NOTARIZE_APPLE_ID: ${{ inputs.apple-notarize-apple-id }}
        APPLE_NOTARIZE_TEAM_ID: ${{ inputs.apple-notarize-team-id }}
        APPLE_NOTARIZE_PASSWORD: ${{ inputs.apple-notarize-password }}
      run: |
        cd "$INSTALL_DIR"

        if [ -n "$APPLE_NOTARIZE_PASSWORD" ]; then
          ditto -c -k --sequesterRsrc --keepParent "Bee Launcher.app" ../BeeLauncher.zip
          xcrun notarytool submit ../BeeLauncher.zip \
            --wait --progress \
            --apple-id "$APPLE_NOTARIZE_APPLE_ID" \
            --team-id "$APPLE_NOTARIZE_TEAM_ID" \
            --password "$APPLE_NOTARIZE_PASSWORD"

          xcrun stapler staple "Bee Launcher.app"
        else
          echo ":warning: Skipping notarization as credentials are not present." >> $GITHUB_STEP_SUMMARY
        fi
        ditto -c -k --sequesterRsrc --keepParent "Bee Launcher.app" ../BeeLauncher.zip

    - name: Create DMG
      shell: bash
      env:
        INSTALL_DIR: install
        VERSION: ${{ inputs.version }}
      run: |
        cd "$INSTALL_DIR"

        mkdir -p src
        cp -R "Bee Launcher.app" src/

        ln -s /Applications src/

        hdiutil create \
            -volname "Bee Launcher $VERSION" \
            -srcfolder src \
            -ov -format ULMO \
            "../BeeLauncher.dmg"

    - name: Make Sparkle signature
      shell: bash
      env:
        SPARKLE_ED25519_KEY: ${{ inputs.sparkle-ed25519-key }}
      run: |
        if [ "$SPARKLE_ED25519_KEY" != '' ]; then
          echo "$SPARKLE_ED25519_KEY" > ed25519-priv.pem
          signature_zip=$(/opt/homebrew/opt/openssl@3/bin/openssl pkeyutl -sign -rawin -in "$GITHUB_WORKSPACE"/BeeLauncher.zip -inkey ed25519-priv.pem | openssl base64 | tr -d \\n)
          signature_dmg=$(/opt/homebrew/opt/openssl@3/bin/openssl pkeyutl -sign -rawin -in "$GITHUB_WORKSPACE"/BeeLauncher.dmg -inkey ed25519-priv.pem | openssl base64 | tr -d \\n) 
          rm ed25519-priv.pem
          cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Artifact Information :information_source:
        - :memo: Sparkle Signature (ed25519): \`$signature_zip\` (ZIP)
        - :memo: Sparkle Signature (ed25519): \`$signature_dmg\` (DMG)
        EOF
        else
          cat >> $GITHUB_STEP_SUMMARY << EOF
        ### Artifact Information :information_source:
        - :warning: Sparkle Signature (ed25519): No private key available (likely a pull request or fork)
        EOF
        fi

    - name: Upload binary tarball
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: BeeLauncher-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}
        path: BeeLauncher.zip

    - name: Upload disk image
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: BeeLauncher-${{ inputs.artifact-name }}-${{ inputs.version }}-${{ inputs.build-type }}.dmg
        path: BeeLauncher.dmg
